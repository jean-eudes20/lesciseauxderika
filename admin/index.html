<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administration — Les ciseaux d'Erika</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Mea+Culpa&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Widget d'authentification Netlify Identity -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", (user) => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>

  <script>
    // --- Aperçus visuels dans l'éditeur : montre à quoi ressemblera
    // le résultat sur le vrai site, avec les couleurs et polices du salon,
    // au lieu d'un simple formulaire brut. ---

    var COULEUR_ROSE = "rgb(193, 53, 132)";
    var COULEUR_BLEU = "rgba(147, 190, 218, 1)";

    CMS.registerPreviewStyle(`
      .apercu { font-family: system-ui, sans-serif; padding: 24px; }
      .apercu h2 { font-family: "Mea Culpa", cursive; font-size: 2.5rem; margin: 0 0 16px; color: #000; }
      .apercu-ligne { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #ddd; }
      .apercu-prix { font-weight: bold; color: ${COULEUR_ROSE}; }
      .apercu-categorie { margin-bottom: 28px; padding: 16px; border-radius: 8px; background: ${COULEUR_BLEU}22; }
      .apercu-categorie h3 { font-family: "Parisienne", cursive; font-size: 1.8rem; margin: 0 0 10px; }
      .apercu-jour { display: flex; justify-content: space-between; padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; background: #f5f5f5; }
      .apercu-jour.ferme { color: #999; font-style: italic; }
      .apercu-contact p { margin: 4px 0; }
    `, { raw: false });

    function listeVersJS(champ) {
      return champ && champ.toJS ? champ.toJS() : (champ || []);
    }

    var PreviewTarifs = createClass({
      render: function () {
        var data = this.props.entry.get('data');
        var extras = listeVersJS(data.get('extras'));
        var categories = listeVersJS(data.get('categories'));
        return h('div', { className: 'apercu' },
          h('h2', {}, 'Les tarifs'),
          extras.map(function (item, i) {
            return h('div', { className: 'apercu-ligne', key: i },
              h('span', {}, item.label), h('span', { className: 'apercu-prix' }, item.prix));
          }),
          categories.map(function (cat, i) {
            return h('div', { className: 'apercu-categorie', key: i },
              h('h3', {}, cat.nom),
              (cat.prestations || []).map(function (p, j) {
                return h('div', { className: 'apercu-ligne', key: j },
                  h('span', {}, p.label), h('span', { className: 'apercu-prix' }, p.prix));
              })
            );
          })
        );
      }
    });

    var PreviewHoraires = createClass({
      render: function () {
        var data = this.props.entry.get('data');
        var jours = listeVersJS(data.get('jours'));
        return h('div', { className: 'apercu' },
          h('h2', {}, 'Nos horaires'),
          jours.map(function (j, i) {
            var ferme = /ferm/i.test(j.horaire || '');
            return h('div', { className: 'apercu-jour' + (ferme ? ' ferme' : ''), key: i },
              h('span', {}, j.jour), h('span', {}, j.horaire));
          })
        );
      }
    });

    var PreviewContact = createClass({
      render: function () {
        var data = this.props.entry.get('data');
        return h('div', { className: 'apercu' },
          h('h2', {}, 'Contact'),
          h('div', { className: 'apercu-contact' },
            h('p', {}, h('strong', {}, 'Nom : '), data.get('nom')),
            h('p', {}, h('strong', {}, 'Adresse : '), data.get('adresse')),
            h('p', {}, h('strong', {}, 'Tél : '), data.get('telephone'))
          )
        );
      }
    });

    CMS.registerPreviewTemplate('tarifs', PreviewTarifs);
    CMS.registerPreviewTemplate('horaires', PreviewHoraires);
    CMS.registerPreviewTemplate('contact', PreviewContact);
  </script>
</body>
</html>
