backend:
  name: git-gateway
  branch: main

# Permet de tester en local avec `npx decap-server` (voir README)
local_backend: true

media_folder: "img"
public_folder: "/img"

publish_mode: simple

locale: "fr"

collections:
  - name: "tarifs"
    label: "Tarifs"
    files:
      - name: "tarifs"
        label: "Tarifs"
        file: "data/tarifs.json"
        fields:
          - label: "Prestations à l'unité (enfants / hommes)"
            name: "extras"
            widget: "list"
            fields:
              - { label: "Prestation", name: "label", widget: "string" }
              - { label: "Prix", name: "prix", widget: "string" }
          - label: "Catégories (court / mi-long / long)"
            name: "categories"
            widget: "list"
            fields:
              - { label: "Nom de la catégorie", name: "nom", widget: "string" }
              - { label: "Photo", name: "image", widget: "image" }
              - label: "Prestations"
                name: "prestations"
                widget: "list"
                fields:
                  - { label: "Prestation", name: "label", widget: "string" }
                  - { label: "Prix", name: "prix", widget: "string" }

  - name: "horaires"
    label: "Horaires"
    files:
      - name: "horaires"
        label: "Horaires d'ouverture"
        file: "data/horaires.json"
        fields:
          - label: "Jours"
            name: "jours"
            widget: "list"
            fields:
              - { label: "Jour", name: "jour", widget: "string" }
              - { label: "Horaire (ou « Fermé »)", name: "horaire", widget: "string" }

  - name: "contact"
    label: "Contact"
    files:
      - name: "contact"
        label: "Informations de contact"
        file: "data/contact.json"
        fields:
          - { label: "Nom", name: "nom", widget: "string" }
          - { label: "Adresse", name: "adresse", widget: "string" }
          - { label: "Téléphone", name: "telephone", widget: "string" }
          - { label: "Lien Instagram", name: "instagram", widget: "string", required: false }
          - { label: "Lien Facebook", name: "facebook", widget: "string", required: false }
